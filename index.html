<script>
    Chart.register(ChartDataLabels);

    let masterData = [], filteredData = [], chartInstances = {}, currentPage = 1, pageSize = 50;
    let debounceTimer = null;
    const COLS = { DATE: 'Date', SHIPMENT_ID: 'ShipmentId', HUB_NAME: 'Hub Name', SELLER_NAME: 'Seller name', STATUS: 'Status', ZONE: 'Zone', LIB: 'LIB', MH: 'MH', WM: 'WM name', GM: 'GM', RCA: 'RCA' };

    document.addEventListener('DOMContentLoaded', () => { 
      lucide.createIcons(); 
      loadRepositoryData(); 
    });

    /* Lever Detach & Theme Toggle Animation */
    function triggerLampToggle() {
      const container = document.getElementById('lamp-switcher');
      container.classList.add('animating');
      setTimeout(() => {
        document.documentElement.classList.toggle('dark');
        renderCharts();
      }, 200);
      setTimeout(() => {
        container.classList.remove('animating');
      }, 400);
    }

    async function loadRepositoryData() {
      showStatusBanner("Scanning /data directory on GitHub...", "info");
      masterData = [];
      try {
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const repoName = pathSegments.length > 0 ? pathSegments[0] : null;
        const ownerName = window.location.hostname.split('.')[0];
        let csvUrls = [];

        if (ownerName && repoName && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
          const resp = await fetch(`https://api.github.com/repos/${ownerName}/${repoName}/contents/data`);
          if (resp.ok) {
            const files = await resp.json();
            csvUrls = files.filter(f => f.name.endsWith('.csv')).map(f => f.download_url);
          }
        }

        // Auto-generate fallback candidates for YYYY-MM-DD.csv format (e.g., 2026-10-05.csv)
        if (csvUrls.length === 0) {
          const years = [2025, 2026, 2027];
          
          years.forEach(yr => {
            for (let mo = 1; mo <= 12; mo++) {
              const monthStr = String(mo).padStart(2, '0');
              for (let day = 1; day <= 31; day++) {
                const dayStr = String(day).padStart(2, '0');
                csvUrls.push(`data/${yr}-${monthStr}-${dayStr}.csv`);
              }
            }
          });
          
          csvUrls.push('data/BRSNR Sept-Dec - 05-10-2026.csv', 'data/sample-2026-10-05.csv', 'data/2026-10-05.csv');
        }

        const fetchedShipmentIds = new Set();
        
        for (const url of csvUrls) {
          try {
            await new Promise((resolve) => {
              Papa.parse(url + '?t=' + Date.now(), {
                download: true,
                header: true,
                skipEmptyLines: true,
                fastMode: true,
                chunk: function(results) {
                  const data = results.data;
                  for (let i = 0; i < data.length; i++) {
                    const row = data[i];
                    const id = row[COLS.SHIPMENT_ID] || row['Shipment ID'] || row['ShipmentId'];
                    if (id && !fetchedShipmentIds.has(id)) {
                      fetchedShipmentIds.add(id);
                      masterData.push(normalizeRow(row, id, url));
                    }
                  }
                },
                complete: function() { resolve(); },
                error: function() { resolve(); }
              });
            });
          } catch (e) {}
        }

        showStatusBanner(`Successfully loaded ${masterData.length.toLocaleString()} shipments.`, masterData.length ? "success" : "warning");
        populateFilterDropdowns();
        applyFilters();
      } catch (err) {
        showStatusBanner("Error scanning /data folder.", "error");
      }
    }

    function isInvalid(val) {
      if (!val) return true;
      const clean = String(val).trim().toUpperCase();
      return clean === '#N/A' || clean === 'N/A' || clean === 'NA' || clean === '#VALUE!' || clean === 'UNKNOWN ZONE' || clean === 'UNASSIGNED';
    }

    function cleanVal(val, defaultVal = 'Unassigned') {
      return isInvalid(val) ? defaultVal : String(val).trim();
    }

    function normalizeRow(r, id, sourceUrl = '') {
      let dtStr = r[COLS.DATE] || r['Date'] || r['date'] || '';
      
      // Fallback: If row level date is missing, parse YYYY-MM-DD from filename
      if (!dtStr && sourceUrl) {
        const filename = sourceUrl.split('/').pop().replace('.csv', '');
        if (/^\d{4}-\d{2}-\d{2}$/.test(filename)) {
          dtStr = filename;
        }
      }

      return {
        Date: dtStr || 'Unassigned Date', 
        ParsedDate: parseDateStrFast(dtStr),
        ShipmentId: id,
        HubName: cleanVal(r[COLS.HUB_NAME] || r['PH Name'], 'Unassigned'), 
        SellerName: cleanVal(r[COLS.SELLER_NAME], 'Unknown Seller'),
        Status: cleanVal(r[COLS.STATUS], 'Unknown Status'), 
        Zone: cleanVal(r[COLS.ZONE], 'Unknown Zone'),
        LIB: cleanVal(r[COLS.LIB], 'Unassigned'), 
        MH: cleanVal(r[COLS.MH], 'Unassigned MH'),
        WM: cleanVal(r[COLS.WM], 'Unassigned WM'), 
        GM: cleanVal(r[COLS.GM], 'Unassigned GM'),
        RCA: cleanVal(r[COLS.RCA], 'None')
      };
    }

    function parseDateStrFast(str) {
      if (!str) return null;
      
      const nativeDate = Date.parse(str);
      if (!isNaN(nativeDate)) {
        return new Date(nativeDate);
      }

      const p = str.split(/[-/]/);
      if (p.length === 3) {
        return p[0].length === 4 
          ? new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2])) 
          : new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
      }

      return null;
    }

    function populateFilterDropdowns() {
      const gms = new Set(), sellers = new Set(), mhs = new Set(), hubs = new Set(), wms = new Set(), statuses = new Set(), libs = new Set(), weeks = new Set(), months = new Set();
      
      for (let i = 0; i < masterData.length; i++) {
        const r = masterData[i];
        if (!isInvalid(r.GM)) gms.add(r.GM); 
        if (!isInvalid(r.SellerName)) sellers.add(r.SellerName);
        if (!isInvalid(r.MH)) mhs.add(r.MH); 
        if (!isInvalid(r.HubName)) hubs.add(r.HubName);
        if (!isInvalid(r.WM)) wms.add(r.WM); 
        if (!isInvalid(r.Status)) statuses.add(r.Status);
        if (!isInvalid(r.LIB)) libs.add(r.LIB);

        if (r.ParsedDate) {
          months.add(r.ParsedDate.toLocaleString('default', { month: 'long', year: 'numeric' }));
          weeks.add(getWeekIdentifier(r.ParsedDate));
        }
      }

      fillSelect('filter-gm', gms); 
      fillSelect('filter-seller', sellers);
      fillSelect('filter-mh', mhs); 
      fillSelect('filter-hub', hubs);
      fillSelect('filter-wm', wms); 
      fillSelect('filter-status', statuses); 
      fillSelect('filter-lib', libs);
      fillSelect('filter-month', months);
      fillSelect('filter-week', weeks);
    }

    function fillSelect(id, set) {
      const sel = document.getElementById(id);
      const curr = sel.value;
      let html = `<option value="ALL">${sel.options[0].text}</option>`;
      const sorted = Array.from(set).sort();
      for (let i = 0; i < sorted.length; i++) {
        html += `<option value="${sorted[i]}">${sorted[i]}</option>`;
      }
      sel.innerHTML = html;
      sel.value = curr;
    }

    function getWeekIdentifier(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return `Week ${weekNo}, ${d.getUTCFullYear()}`;
    }

    function applyWeekFilter() {
      const wk = document.getElementById('filter-week').value;
      if (wk !== 'ALL') {
        document.getElementById('filter-month').value = 'ALL';
        document.getElementById('filter-date-from').value = '';
        document.getElementById('filter-date-to').value = '';
      }
      applyFilters();
    }

    function applyMonthFilter() {
      const mo = document.getElementById('filter-month').value;
      if (mo !== 'ALL') {
        document.getElementById('filter-week').value = 'ALL';
        document.getElementById('filter-date-from').value = '';
        document.getElementById('filter-date-to').value = '';
      }
      applyFilters();
    }

    function debouncedApplyFilters() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => { applyFilters(); }, 250);
    }

    function applyFilters() {
      const search = document.getElementById('filter-search').value.toLowerCase().trim();
      const df = document.getElementById('filter-date-from').value ? new Date(document.getElementById('filter-date-from').value) : null;
      const dt = document.getElementById('filter-date-to').value ? new Date(document.getElementById('filter-date-to').value) : null;
      const wk = document.getElementById('filter-week').value;
      const mo = document.getElementById('filter-month').value;
      const gm = document.getElementById('filter-gm').value;
      const seller = document.getElementById('filter-seller').value;
      const mh = document.getElementById('filter-mh').value;
      const hub = document.getElementById('filter-hub').value;
      const wm = document.getElementById('filter-wm').value;
      const status = document.getElementById('filter-status').value;
      const lib = document.getElementById('filter-lib').value;

      const res = [];
      for (let i = 0; i < masterData.length; i++) {
        const r = masterData[i];
        if (gm !== 'ALL' && r.GM !== gm) continue;
        if (seller !== 'ALL' && r.SellerName !== seller) continue;
        if (mh !== 'ALL' && r.MH !== mh) continue;
        if (hub !== 'ALL' && r.HubName !== hub) continue;
        if (wm !== 'ALL' && r.WM !== wm) continue;
        if (status !== 'ALL' && r.Status !== status) continue;
        if (lib !== 'ALL' && r.LIB !== lib) continue;

        const rd = r.ParsedDate;
        if (rd) {
          if (wk !== 'ALL' && getWeekIdentifier(rd) !== wk) continue;
          if (mo !== 'ALL' && rd.toLocaleString('default', { month: 'long', year: 'numeric' }) !== mo) continue;
          if (df && rd < df) continue;
          if (dt && rd > dt) continue;
        } else if (wk !== 'ALL' || mo !== 'ALL' || df || dt) {
          continue;
        }

        if (search && !r.ShipmentId.toLowerCase().includes(search) && !r.WM.toLowerCase().includes(search) && !r.SellerName.toLowerCase().includes(search)) continue;
        res.push(r);
      }

      filteredData = res;

      updateKPIs(); 
      renderCharts(); 
      renderAllAgingMatrices(); 
      renderSummaryTables();
      renderShipmentsTable();
    }

    function updateKPIs() {
      const tot = filteredData.length;
      document.getElementById('kpi-total-volume').textContent = tot.toLocaleString();
      
      let rec = 0, disp = 0;

      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        if (r.Status === 'received_at_mh') rec++;
        if (r.Status === 'dispatched_to_mh') disp++;
      }
      
      document.getElementById('kpi-received-mh').textContent = rec.toLocaleString();
      document.getElementById('kpi-received-pct').textContent = `${tot ? ((rec/tot)*100).toFixed(1) : 0}% of total`;
      document.getElementById('kpi-dispatched-mh').textContent = disp.toLocaleString();
      document.getElementById('kpi-dispatched-pct').textContent = `${tot ? ((disp/tot)*100).toFixed(1) : 0}% dispatched`;
      
      document.getElementById('kpi-active-zones').textContent = '4';
    }

    function renderCharts() {
      const isDark = document.documentElement.classList.contains('dark');
      const textColor = isDark ? '#f8fafc' : '#0f172a';

      const dailyMap = {};
      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        if (r.Date) dailyMap[r.Date] = (dailyMap[r.Date] || 0) + 1;
      }

      let sortedDates = Object.keys(dailyMap).sort((a, b) => (parseDateStrFast(a) || 0) - (parseDateStrFast(b) || 0));
      let displayLabels = [...sortedDates];
      let displayValues = sortedDates.map(d => dailyMap[d]);

      if (sortedDates.length > 0 && sortedDates.length <= 4) {
        displayLabels = ['', ...sortedDates, ''];
        displayValues = [null, ...sortedDates.map(d => dailyMap[d]), null];
      }

      createChart('chart-daily-trend', 'line', {
        labels: displayLabels,
        datasets: [{
          label: 'Shipments', data: displayValues,
          borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.15)', fill: true, tension: 0.3, pointRadius: 5
        }]
      }, {
        scales: { x: { bounds: 'ticks', ticks: { color: textColor } }, y: { ticks: { color: textColor } } },
        plugins: { datalabels: { align: 'top', color: '#6366f1', font: { weight: 'bold' } } }
      });

      const zoneMap = {};
      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        if (!isInvalid(r.Zone)) zoneMap[r.Zone] = (zoneMap[r.Zone] || 0) + 1;
      }
      createChart('chart-zone', 'pie', {
        labels: Object.keys(zoneMap).slice(0, 4),
        datasets: [{ 
          data: Object.values(zoneMap).slice(0, 4), 
          backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ec4899']
        }]
      }, { plugins: { datalabels: { color: '#fff', font: { weight: 'bold' } } } });

      const statusMap = {};
      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        if (!isInvalid(r.Status)) statusMap[r.Status] = (statusMap[r.Status] || 0) + 1;
      }
      createChart('chart-status-split', 'doughnut', {
        labels: Object.keys(statusMap),
        datasets: [{ 
          data: Object.values(statusMap), 
          backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#ef4444']
        }]
      }, { plugins: { datalabels: { color: '#fff', font: { weight: 'bold' } } } });

      const sellerMap = {};
      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        if (!isInvalid(r.SellerName)) sellerMap[r.SellerName] = (sellerMap[r.SellerName] || 0) + 1;
      }
      const topSellers = Object.entries(sellerMap).sort((a,b) => b[1] - a[1]).slice(0, 10);
      createChart('chart-seller-column', 'bar', {
        labels: topSellers.map(i => i[0].length > 20 ? i[0].substring(0,20) + '...' : i[0]),
        datasets: [{ label: 'Volume', data: topSellers.map(i => i[1]), backgroundColor: '#ec4899', borderRadius: 6 }]
      }, { 
        scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } },
        plugins: { datalabels: { align: 'end', anchor: 'end', color: isDark ? '#f472b6' : '#9d174d', font: { weight: 'bold' } } } 
      });

      const gmMap = {};
      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        if (!isInvalid(r.GM)) gmMap[r.GM] = (gmMap[r.GM] || 0) + 1;
      }
      const topGMs = Object.entries(gmMap).sort((a,b) => b[1] - a[1]).slice(0, 10);
      createChart('chart-gm-column', 'bar', {
        labels: topGMs.map(i => i[0]),
        datasets: [{ label: 'Volume', data: topGMs.map(i => i[1]), backgroundColor: '#6366f1', borderRadius: 6 }]
      }, { 
        scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } },
        plugins: { datalabels: { align: 'end', anchor: 'end', color: isDark ? '#a5b4fc' : '#312e81', font: { weight: 'bold' } } } 
      });

      const wmMap = {};
      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        if (!isInvalid(r.WM)) wmMap[r.WM] = (wmMap[r.WM] || 0) + 1;
      }
      const topWMs = Object.entries(wmMap).sort((a,b) => b[1] - a[1]).slice(0, 10);
      createChart('chart-wm-column', 'bar', {
        labels: topWMs.map(i => i[0]),
        datasets: [{ label: 'Volume', data: topWMs.map(i => i[1]), backgroundColor: '#0ea5e9', borderRadius: 6 }]
      }, { 
        scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } },
        plugins: { datalabels: { align: 'end', anchor: 'end', color: isDark ? '#7dd3fc' : '#0369a1', font: { weight: 'bold' } } } 
      });

      const phMap = {};
      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        if (!isInvalid(r.HubName)) phMap[r.HubName] = (phMap[r.HubName] || 0) + 1;
      }
      const topPHs = Object.entries(phMap).sort((a,b) => b[1] - a[1]).slice(0, 8);
      createChart('chart-ph-bar', 'bar', {
        labels: topPHs.map(i => i[0]),
        datasets: [{ label: 'Volume', data: topPHs.map(i => i[1]), backgroundColor: '#8b5cf6', borderRadius: 6 }]
      }, { 
        scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } },
        plugins: { datalabels: { align: 'end', anchor: 'end', color: isDark ? '#c084fc' : '#5b21b6', font: { weight: 'bold' } } } 
      });

      const mhMap = {};
      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        if (!isInvalid(r.MH)) mhMap[r.MH] = (mhMap[r.MH] || 0) + 1;
      }
      const topMH = Object.entries(mhMap).sort((a, b) => b[1] - a[1]).slice(0, 8);
      createChart('chart-top-mh', 'bar', {
        labels: topMH.map(i => i[0]),
        datasets: [{ label: 'Volume', data: topMH.map(i => i[1]), backgroundColor: '#3b82f6', borderRadius: 4 }]
      }, { 
        indexAxis: 'y', 
        scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } },
        plugins: { datalabels: { align: 'end', anchor: 'end', color: isDark ? '#93c5fd' : '#1e3a8a', font: { weight: 'bold' } } } 
      });
    }

    function createChart(id, type, data, options = {}) {
      if (chartInstances[id]) chartInstances[id].destroy();
      const ctx = document.getElementById(id).getContext('2d');
      chartInstances[id] = new Chart(ctx, {
        type: type, data: data,
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { 
            legend: { 
              position: 'bottom', 
              labels: { boxWidth: 10, font: { size: 10 }, color: document.documentElement.classList.contains('dark') ? '#f8fafc' : '#0f172a' } 
            }, 
            ...options.plugins 
          },
          ...options
        }
      });
    }

    function renderAllAgingMatrices() {
      renderSingleMatrix('Zone', 'matrix-thead-zone', 'matrix-tbody-zone', 'Zone');
      renderSingleMatrix('SellerName', 'matrix-thead-seller', 'matrix-tbody-seller', 'Seller Name');
      renderSingleMatrix('GM', 'matrix-thead-gm', 'matrix-tbody-gm', 'GM Name');
      renderSingleMatrix('MH', 'matrix-thead-mh', 'matrix-tbody-mh', 'Mother Hub');
      renderSingleMatrix('HubName', 'matrix-thead-ph', 'matrix-tbody-ph', 'Pickup Hub');
      renderSingleMatrix('WM', 'matrix-thead-wm', 'matrix-tbody-wm', 'Worker / WM');
    }

    function renderSingleMatrix(fieldKey, theadId, tbodyId, rowHeaderTitle) {
      const datesSet = new Set();
      const matrix = {};

      for (let i = 0; i < filteredData.length; i++) {
        const r = filteredData[i];
        const cat = r[fieldKey];
        if (isInvalid(cat)) continue;
        const d = r.Date || 'No Date';
        datesSet.add(d);
        if (!matrix[cat]) matrix[cat] = {};
        matrix[cat][d] = (matrix[cat][d] || 0) + 1;
      }

      const dates = Array.from(datesSet).sort((a,b) => (parseDateStrFast(a)||0) - (parseDateStrFast(b)||0));

      const thead = document.getElementById(theadId);
      thead.innerHTML = `<th class="p-3">${rowHeaderTitle}</th>` + dates.map(d => `<th class="p-3 text-center">${d}</th>`).join('') + `<th class="p-3 text-right bg-slate-100 dark:bg-slate-900">Total</th>`;

      const tbody = document.getElementById(tbodyId);
      const categories = Object.keys(matrix).sort();
      let fragmentHtml = '';

      for (let i = 0; i < categories.length; i++) {
        const cat = categories[i];
        let tot = 0;
        let html = `<tr class="hover:bg-slate-50 dark:hover:bg-slate-700 transition border-b border-slate-100 dark:border-slate-700 hover:border-indigo-400"><td class="p-3 font-semibold text-slate-900 dark:text-white">${cat}</td>`;
        for (let j = 0; j < dates.length; j++) {
          const v = matrix[cat][dates[j]] || 0;
          tot += v;
          html += `<td class="p-3 text-center">${v ? v.toLocaleString() : '-'}</td>`;
        }
        html += `<td class="p-3 text-right font-bold text-indigo-600 dark:text-indigo-400 bg-slate-50 dark:bg-slate-900">${tot.toLocaleString()}</td></tr>`;
        fragmentHtml += html;
      }
      tbody.innerHTML = fragmentHtml;
    }

    function renderSummaryTables() {
      const tot = filteredData.length || 1;
      populateSummaryTable('tbl-zone-body', 'Zone', tot);
      populateSummaryTable('tbl-seller-body', 'SellerName', tot);
      populateSummaryTable('tbl-gm-body', 'GM', tot);
      populateSummaryTable('tbl-wm-body', 'WM', tot);
      populateSummaryTable('tbl-ph-body', 'HubName', tot);
    }

    function populateSummaryTable(elementId, fieldKey, totalCount) {
      const map = {};
      for (let i = 0; i < filteredData.length; i++) {
        const k = filteredData[i][fieldKey];
        if (isInvalid(k)) continue;
        map[k] = (map[k] || 0) + 1;
      }

      const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]);
      const tbody = document.getElementById(elementId);
      let html = '';

      for (let i = 0; i < sorted.length; i++) {
        const [key, count] = sorted[i];
        const pct = ((count / totalCount) * 100).toFixed(1);
        html += `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-700 transition hover:border-indigo-400">
            <td class="p-2 font-medium text-slate-800 dark:text-slate-200">${key}</td>
            <td class="p-2 text-right font-mono text-slate-900 dark:text-white font-semibold">${count.toLocaleString()}</td>
            <td class="p-2 text-right font-mono text-indigo-600 dark:text-indigo-400 font-semibold">${pct}%</td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    function renderShipmentsTable() {
      const tbody = document.getElementById('shipments-tbody');
      const tot = filteredData.length, pages = Math.ceil(tot / pageSize) || 1;
      currentPage = Math.min(currentPage, pages);
      document.getElementById('table-record-count').textContent = `Showing ${tot ? (currentPage - 1) * pageSize + 1 : 0} to ${Math.min(currentPage * pageSize, tot)} of ${tot.toLocaleString()} shipments`;
      document.getElementById('page-indicator').textContent = `Page ${currentPage} of ${pages}`;

      const start = (currentPage - 1) * pageSize;
      const end = Math.min(start + pageSize, tot);
      let html = '';

      for (let i = start; i < end; i++) {
        const r = filteredData[i];
        html += `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-700 transition hover:border-indigo-400">
            <td class="p-3">${r.Date}</td>
            <td class="p-3 font-mono text-indigo-600 dark:text-indigo-400 font-semibold">${r.ShipmentId}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${r.Status === 'received_at_mh' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'}">${r.Status}</span></td>
            <td class="p-3">${r.Zone}</td>
            <td class="p-3">${r.MH}</td>
            <td class="p-3 font-medium">${r.GM}</td>
            <td class="p-3">${r.WM}</td>
            <td class="p-3 truncate max-w-[150px]">${r.SellerName}</td>
            <td class="p-3">${r.LIB}</td>
            <td class="p-3">${r.RCA}</td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    function prevPage() { if (currentPage > 1) { currentPage--; renderShipmentsTable(); } }
    function nextPage() { currentPage++; renderShipmentsTable(); }
    function changePageSize() { pageSize = parseInt(document.getElementById('table-page-size').value); currentPage = 1; renderShipmentsTable(); }

    function switchTab(t) {
      ['overview', 'matrix', 'tables', 'table'].forEach(tab => {
        document.getElementById(`tab-${tab}`).classList.add('hidden');
        document.getElementById(`tab-btn-${tab}`).classList.remove('border-indigo-600', 'text-indigo-600', 'dark:text-indigo-400', 'font-semibold', 'bg-indigo-50', 'dark:bg-slate-800', 'ring-1', 'ring-indigo-300');
        document.getElementById(`tab-btn-${tab}`).classList.add('border-transparent', 'text-slate-500', 'dark:text-slate-400');
      });
      
      document.getElementById(`tab-${t}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${t}`);
      activeBtn.classList.remove('border-transparent', 'text-slate-500', 'dark:text-slate-400');
      activeBtn.classList.add('border-indigo-600', 'text-indigo-600', 'dark:text-indigo-400', 'font-semibold', 'bg-indigo-50', 'dark:bg-slate-800', 'ring-1', 'ring-indigo-300');
    }

    function setPresetDate(p) {
      const f = document.getElementById('filter-date-from'), t = document.getElementById('filter-date-to'), today = new Date();
      document.getElementById('filter-week').value = 'ALL';
      document.getElementById('filter-month').value = 'ALL';
      if (p === 'all') { f.value = ''; t.value = ''; }
      else if (p === 'today') { f.value = today.toISOString().split('T')[0]; t.value = f.value; }
      else if (p === '7days') { const past = new Date(today); past.setDate(past.getDate() - 7); f.value = past.toISOString().split('T')[0]; t.value = today.toISOString().split('T')[0]; }
      applyFilters();
    }

    function resetAllFilters() {
      ['filter-search', 'filter-date-from', 'filter-date-to'].forEach(id => document.getElementById(id).value = '');
      ['filter-week', 'filter-month', 'filter-gm', 'filter-seller', 'filter-mh', 'filter-hub', 'filter-wm', 'filter-status', 'filter-lib'].forEach(id => document.getElementById(id).value = 'ALL');
      applyFilters();
    }

    function exportFilteredCSV() { downloadBlob(Papa.unparse(filteredData), `BRSNR_Export_${new Date().toISOString().split('T')[0]}.csv`); }
    function exportMatrixCSV(tableId, filenamePrefix) {
      const rows = [];
      document.querySelectorAll(`#${tableId} tr`).forEach(tr => {
        const row = []; tr.querySelectorAll('th, td').forEach(td => row.push(`"${td.innerText.replace(/"/g, '""')}"`)); rows.push(row.join(','));
      });
      downloadBlob(rows.join('\n'), `BRSNR_${filenamePrefix}_${new Date().toISOString().split('T')[0]}.csv`);
    }

    function downloadBlob(content, name) {
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    }

    function showStatusBanner(msg, type) {
      const b = document.getElementById('status-banner');
      document.getElementById('status-banner-text').textContent = msg;
      b.classList.remove('hidden');
    }
  </script>
