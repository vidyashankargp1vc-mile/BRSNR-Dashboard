name: Compile CSVs to JSON

on:
  push:
    paths:
      - 'data/*.csv'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install papaparse

      - name: Run Data Compiler Script
        run: node scripts/compile-data.js

      - name: Commit and Push master-data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/master-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: compile CSVs to master-data.json" && git push)
