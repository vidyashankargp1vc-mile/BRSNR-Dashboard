name: Compile CSVs to JSON

on:
  push:
    paths:
      - 'data/*.csv'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install papaparse

      - name: Run Data Compiler Script
        run: node scripts/compile-data.js

      - name: Upload compiled JSON output
        uses: actions/upload-artifact@v4
        with:
          name: master-data
          path: data/master-data.json
