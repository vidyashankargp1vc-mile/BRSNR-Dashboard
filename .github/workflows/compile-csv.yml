name: Compile CSVs to JSON

on:
  push:
    paths:
      - 'data/*.csv'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: compile-csv
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install papaparse

      - name: Run Data Compiler Script
        run: node scripts/compile-data.js

      - name: Commit compiled JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/master-*.json
          git diff --staged --quiet || (git commit -m "Update master data JSON" && git pull --rebase && git push)
